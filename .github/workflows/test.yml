name: test

on:
  pull_request:
  push:
    branches: [main]

# The tests only read the checkout.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # report-sdk-issue's script supports Node 18 and up; Creator Hub runs it on newer ones.
        node: [18, 24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # A shell glob, not a directory: Node 24 reads `node --test tests/` as a file path.
      - run: node --test tests/*.test.mjs
        shell: bash
