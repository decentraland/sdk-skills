name: test

on:
  pull_request:
  push:
    branches: [main]

# The tests only read the checkout.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # report-sdk-issue's script supports Node 18 and up; Creator Hub runs it on newer ones.
        node: [18, 24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # A shell glob, not a directory: Node 24 reads `node --test tests/` as a file path.
      - run: node --test tests/*.test.mjs
        shell: bash

  # promote-scene ships Python tools and a Remotion project that no test exercises: compile them, type-check the
  # video project and run build_kit.py on the example kit, on Ubuntu and on Windows (the tools promise both).
  promote-scene:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m py_compile promote-scene/scripts/*.py
      # build_kit.py on the example kit, laid out as the skill installs it (<scene>/promote/tools/), with no
      # images yet: it must still write kit-data.js, copy.md and footage-shotlist.md, and the marker flags must
      # accept a real post id and reject a bad one.
      - run: |
          python -m pip install --quiet pillow
          mkdir -p kit/promote/tools
          cp promote-scene/scripts/*.py kit/promote/tools/
          cp promote-scene/scripts/posts.example.json kit/promote/posts.json
          python kit/promote/tools/build_kit.py
          python kit/promote/tools/build_kit.py --rendering footage-01
          test -f kit/promote/videos/footage-01.rendering
          python kit/promote/tools/build_kit.py --done footage-01
          test ! -e kit/promote/videos/footage-01.rendering
          ! python kit/promote/tools/build_kit.py --rendering ../escape
          test ! -e kit/promote/escape.rendering
          test -s kit/promote/kit-data.js && test -s kit/promote/copy.md && test -s kit/promote/footage-shotlist.md
      # src/lib/config.ts reads the kit's posts.json three levels up from src/lib; in the repo that is scripts/posts.json.
      - run: cp promote-scene/scripts/posts.example.json promote-scene/scripts/posts.json
      - run: npm ci
        working-directory: promote-scene/scripts/video
      - run: npx tsc --noEmit
        working-directory: promote-scene/scripts/video
